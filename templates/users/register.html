{% extends 'base.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Зареєструватись</button>
        </form>
        <p class="mt-3">Вже є акаунт? <a href="/login/">Увійти</a></p>
    </div>
</div>
{% endblock %}
