{% extends 'base.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Вхід</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Увійти</button>
        </form>
        <p class="mt-3">Немає акаунту? <a href="/register/">Зареєструватись</a></p>
    </div>
</div>
{% endblock %}
