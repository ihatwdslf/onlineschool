<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Online School{% endblock %}</title>
    <!-- bootstrap щоб не писати css з нуля -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- навігація зверху -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🎓 Online School</a>
        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
                <span class="navbar-text text-white me-3">{{ user.username }}</span>
                {% if user.is_teacher %}
                    <a class="nav-link text-white" href="/courses/create/">Створити курс</a>
                {% endif %}
                <a class="nav-link text-white" href="/logout/">Вийти</a>
            {% else %}
                <a class="nav-link text-white" href="/login/">Увійти</a>
                <a class="nav-link text-white" href="/register/">Реєстрація</a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- основний контент сторінки -->
<div class="container mt-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
